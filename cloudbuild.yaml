# Cloud Build config for Cloud Run deployment.
#
# NEXT_PUBLIC_* env vars are inlined into the client bundle at BUILD time by
# Next.js. They cannot be set as runtime env vars on Cloud Run. This file pulls
# them from Secret Manager (one secret per key, or a single JSON secret) and
# passes them as Docker build args.
#
# Runtime-only vars (GEMINI_API_KEY, FIRESTORE_PROJECT_ID, TRANSPORT, etc.)
# are set on the Cloud Run service via --set-env-vars / --set-secrets and do
# NOT need to be here.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_FIREBASE_CLIENT_SECRETS="projects/PROJECT_ID/secrets/firebase-client/*"
#   gcloud run deploy agent-commons --image=gcr.io/$PROJECT_ID/agent-commons ...
#
# Or with --source (which auto-detects this file):
#   gcloud run deploy agent-commons --source . --region us-central1 \
#     --set-env-vars FIRESTORE_PROJECT_ID=$(gcloud config get-value project)

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/agent-commons
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FB_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FB_MSG_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FB_MEASUREMENT_ID}
      - .

images:
  - gcr.io/$PROJECT_ID/agent-commons
